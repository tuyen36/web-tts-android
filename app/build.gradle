plugins {
    id 'com.android.application'
}

android {
    namespace "com.example.webtts"
    compileSdk 34

    defaultConfig {
        applicationId "com.example.webtts"
        // Target hien dai: Android 10+ (API 29). minSdk 29 -> duoc dung
        // API hien dai (TTS gb, SAF, WebView nhe), APK gon hon ban K016.
        minSdk 29
        targetSdk 34
        versionCode 9
        versionName "2.2"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.google.android.material:material:1.11.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    // RecyclerView cho list phu de + list video.
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    // V1.7: WebSocket cho Edge TTS HoaiMy (port tu edge-tts Python).
    implementation "org.java-websocket:Java-WebSocket:1.5.6"
    // V2.2: NewPipeExtractor FORK tuyen36 (giong youtube-lite) de tu lay sub.
    implementation "com.github.tuyen36:NewPipeExtractor:v0.26.5-k016"
    implementation "com.squareup.okhttp3:okhttp:3.14.9"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
}
