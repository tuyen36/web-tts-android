plugins {
    id 'com.android.application'
}

android {
    namespace "com.example.webtts"
    compileSdk 34

    defaultConfig {
        applicationId "com.example.webtts"
        // Target hien dai: Android 10+ (API 29). minSdk 29 -> duoc dung
        // API hien dai (TTS gb, SAF, WebView nhe), APK gon hon ban K016.
        minSdk 29
        targetSdk 34
        versionCode 4
        versionName "1.3"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.google.android.material:material:1.11.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    // RecyclerView cho list phu de + list video.
    implementation "androidx.recyclerview:recyclerview:1.3.2"
}
